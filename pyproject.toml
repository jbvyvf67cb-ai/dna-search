[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dnasearch"
version = "0.1.0"
description = "Trio/singleton rare-variant triage and reporting for undiagnosed cases (immunodeficiency focus)"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
dnasearch = "dnasearch.cli:main"

[tool.setuptools]
packages = ["dnasearch"]

[tool.pytest.ini_options]
testpaths = ["tests"]
